[project]
name = "cca-archive"
version = "0.1.0"
description = "Archive CCA Exhibitions Flickr account — extract metadata via LLM, download images, export CSV"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flickrapi==2.4.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "pydantic-ai==2.22.0",
    "httpx==0.28.1",
    "rich==15.0.0",
    "python-slugify==8.0.4",
    "python-dotenv==1.2.2",
    "internetarchive==5.11.0",
    "google-cloud-storage==3.13.0",
    "pyvips==3.1.1",
]

[project.scripts]
cca-archive = "cca_archive.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cca_archive"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]
